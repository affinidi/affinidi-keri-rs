[advisories]
version = 2

[bans]
# blake2 has no release on the 0.11 `digest` generation, so `digest` 0.10 and
# 0.11 legitimately coexist. Revisit if the list grows beyond that.
multiple-versions = "warn"

# bincode is permanently unmaintained (RUSTSEC-2025-0141). It was never a
# direct dependency — it came in through `heed`'s default features, which we
# now switch off because only the `Str` and `Bytes` codecs are ever used. The
# ban is here rather than left to `audit`, because a feature flag flipped back
# on somewhere in the graph would otherwise reintroduce it silently and only
# surface on the next advisory-database run.
[[bans.deny]]
name = "bincode"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "CC0-1.0",
  "ISC",
  "MIT-0",
  "MIT",
  "Unlicense",
  "Zlib",
  "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
